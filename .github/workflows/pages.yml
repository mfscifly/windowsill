# Publishes the site to GitHub Pages: the demo at / and, when this repo has Supabase
# settings, the real app at /app/.
# Settings → Pages → Source: "GitHub Actions".
# Settings → Secrets and variables → Actions → Variables: SUPABASE_URL and SUPABASE_KEY
# (the publishable key). Leave them unset in a fork to publish only the demo.
name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Assemble site
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_KEY: ${{ vars.SUPABASE_KEY }}
          VAPID_PUBLIC_KEY: ${{ vars.VAPID_PUBLIC_KEY }}
        run: |
          mkdir -p _site
          cp index.html _site/
          cp -r demo icons docs src _site/
          if [ -n "$SUPABASE_URL" ] && [ -n "$SUPABASE_KEY" ]; then
            bash scripts/build.sh
            cp -r dist _site/app
          else
            echo "No Supabase settings: publishing the demo only."
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
